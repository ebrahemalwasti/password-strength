<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <!-- Bootstrap Css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-white">
    <div class="container mt-5">
        <h1 class="display-2 text-center">Password Strength Checker</h1>
        <h6 class="display-6 text-center">Presented To: Dr.Issam Mohamad Salman</h6>
        <h6 class="text-center p-3">Syrian Virtual University</h6>
        <form method="post">
            <div class="col-6 m-auto">
                <label for="password" class="form-label">Enter Your Password: </label>
                <input type="password" id="password" class="form-control" name="password" required>
                <input type="submit" value="Check Password" class="btn btn-primary mt-3">
            </div>
            
        </form>
    </div>
    <!-- Bootstrap Javascript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
